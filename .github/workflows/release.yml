name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (overrides conventional commit detection)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Skip version bump commits pushed by this workflow
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      version: ${{ steps.bump.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect bump type from conventional commits
        id: detect
        run: |
          # If manually triggered, use the provided bump type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump_type }}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the latest version tag
          LAST_TAG=$(git tag --sort=-v:refname | grep '^v' | head -1)

          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$LAST_TAG..HEAD"
          fi

          echo "Analyzing commits in range: $RANGE"

          BUMP="none"

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue

            # Check for BREAKING CHANGE (major)
            if echo "$msg" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$msg" | grep -qi 'BREAKING CHANGE'; then
              BUMP="major"
              break
            fi

            # Check for feat (minor)
            if echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              if [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
            fi

            # Check for fix (patch)
            if echo "$msg" | grep -qE '^fix(\(.+\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
              fi
            fi
          done <<< "$(git log "$RANGE" --pretty=format:'%s' --no-merges)"

          if [ "$BUMP" = "none" ]; then
            echo "No releasable conventional commits found. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "Detected bump type: $BUMP"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and tag
        id: bump
        if: steps.detect.outputs.should_release == 'true'
        run: |
          BUMP_TYPE="${{ steps.detect.outputs.type }}"

          CURRENT=$(grep '"version"' package.json | head -1 | sed 's/.*"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $CURRENT -> $NEW_VERSION ($BUMP_TYPE)"

          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" package.json
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore(release): v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main --tags

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        if: steps.detect.outputs.should_release == 'true'
        run: |
          NEW_VERSION="${{ steps.bump.outputs.version }}"

          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | grep -v "v$NEW_VERSION" | head -1)

          if [ -z "$PREV_TAG" ]; then
            RANGE="v$NEW_VERSION"
          else
            RANGE="$PREV_TAG..v$NEW_VERSION"
          fi

          echo "Generating changelog for $RANGE"

          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line" | grep -qi "^chore(release)" && continue

            if echo "$line" | grep -qiE "^feat(\(.+\))?[!]?:"; then
              MSG=$(echo "$line" | sed 's/^feat[^:]*: *//')
              FEATURES="${FEATURES}- ${MSG}\n"
            elif echo "$line" | grep -qiE "^fix(\(.+\))?[!]?:"; then
              MSG=$(echo "$line" | sed 's/^fix[^:]*: *//')
              FIXES="${FIXES}- ${MSG}\n"
            else
              MSG=$(echo "$line" | sed 's/^[a-z]*[^:]*: *//')
              OTHER="${OTHER}- ${MSG}\n"
            fi
          done <<< "$(git log "$RANGE" --pretty=format:'%s' --no-merges)"

          CHANGELOG=""
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### Bug Fixes\n${FIXES}\n"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### Other Changes\n${OTHER}\n"
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No notable changes."
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            echo -e "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
            node_arch: 'darwin-arm64'
            node_triple: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macOS (Intel)'
            node_arch: 'darwin-x64'
            node_triple: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux'
            node_arch: 'linux-x64'
            node_triple: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows'
            node_arch: 'win-x64'
            node_triple: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    name: Build - ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Download cross-target Node.js sidecar
        if: matrix.platform == 'macos-latest'
        run: bash scripts/download-lsp-deps.sh ${{ matrix.node_triple }}

      - name: Download LSP dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $NODE_VERSION = "v22.14.0"
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-${{ matrix.node_arch }}.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extract
          Copy-Item "node-extract/node-$NODE_VERSION-${{ matrix.node_arch }}/node.exe" "src-tauri/bin/node-${{ matrix.node_triple }}.exe"
          New-Item -ItemType Directory -Force -Path src-tauri/resources/lsp-servers/typescript | Out-Null
          npm install --prefix src-tauri/resources/lsp-servers/typescript typescript-language-server typescript --save

      - name: Generate macOS icon with proper padding
        if: matrix.platform == 'macos-latest'
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install Pillow
          python scripts/generate-macos-icon.py

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: 'Amend v__VERSION__'
          releaseBody: ${{ needs.prepare.outputs.changelog }}
          releaseDraft: false
          args: ${{ matrix.args }}
