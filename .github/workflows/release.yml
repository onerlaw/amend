name: Build and Release

on:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Determine bump type
        id: bump-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump_type }}" >> "$GITHUB_OUTPUT"
          else
            TYPE="${GITHUB_REF_NAME#release/}"
            if [[ ! "$TYPE" =~ ^(major|minor|patch)$ ]]; then
              echo "::error::Invalid bump type '$TYPE'. Use release/major, release/minor, or release/patch"
              exit 1
            fi
            echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump version and tag
        id: bump
        run: |
          BUMP_TYPE="${{ steps.bump-type.outputs.type }}"

          CURRENT=$(grep '"version"' package.json | head -1 | sed 's/.*"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $CURRENT -> $NEW_VERSION"

          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" package.json
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main --tags

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          NEW_VERSION="${{ steps.bump.outputs.version }}"

          # Find the previous release tag (the one before the tag we just created)
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | grep -v "v$NEW_VERSION" | head -1)

          if [ -z "$PREV_TAG" ]; then
            # No previous tag, use all commits up to the new tag
            RANGE="v$NEW_VERSION"
          else
            RANGE="$PREV_TAG..v$NEW_VERSION"
          fi

          echo "Generating changelog for $RANGE"

          # Collect commits, skip version bump commits
          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS= read -r line; do
            # Skip empty lines and version bump commits
            [ -z "$line" ] && continue
            echo "$line" | grep -qi "^bump version" && continue

            if echo "$line" | grep -qi "^feat"; then
              # Strip conventional commit prefix
              MSG=$(echo "$line" | sed 's/^feat[^:]*: *//')
              FEATURES="${FEATURES}- ${MSG}\n"
            elif echo "$line" | grep -qi "^fix"; then
              MSG=$(echo "$line" | sed 's/^fix[^:]*: *//')
              FIXES="${FIXES}- ${MSG}\n"
            else
              # Strip any conventional commit prefix (chore:, docs:, refactor:, etc.)
              MSG=$(echo "$line" | sed 's/^[a-z]*[^:]*: *//')
              OTHER="${OTHER}- ${MSG}\n"
            fi
          done <<< "$(git log "$RANGE" --pretty=format:'%s' --no-merges)"

          # Build changelog
          CHANGELOG=""
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### Bug Fixes\n${FIXES}\n"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### Other Changes\n${OTHER}\n"
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No notable changes."
          fi

          # Write to output using heredoc delimiter for multiline
          {
            echo "changelog<<CHANGELOG_EOF"
            echo -e "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete trigger tag
        if: startsWith(github.ref, 'refs/tags/release/')
        run: git push origin --delete "${{ github.ref_name }}"

  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macOS (Intel)'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    name: Build - ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate macOS icon with proper padding
        if: matrix.platform == 'macos-latest'
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install Pillow
          python scripts/generate-macos-icon.py

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: 'Amend v__VERSION__'
          releaseBody: ${{ needs.prepare.outputs.changelog }}
          releaseDraft: false
          args: ${{ matrix.args }}
